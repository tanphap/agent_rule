name: Repository contracts
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static contract tests only (not orchestration E2E)
        run: python -m unittest discover -s tests -p "test_repository_contracts.py" -v
